<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spaceship Attack</title>
    <link rel="stylesheet" href="/src/shared/mode-picker.css" />
    <link rel="stylesheet" href="/src/shared/home-button.css" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #05070f; color: #eef3f8; }
      body { display: grid; place-items: center; }
      #screen { display: none; image-rendering: auto; border-radius: 6px; box-shadow: 0 0 40px rgba(50, 110, 200, .25); }


      #messages { position: fixed; top: 18%; left: 0; right: 0; text-align: center; pointer-events: none; }
      .msg { font: 600 19px system-ui, sans-serif; color: #ffd54f; margin: 4px 0; transition: opacity 1s; text-shadow: 0 1px 3px #000; }
      .msg.fade { opacity: 0; }
      #controls { position: fixed; bottom: 10px; left: 0; right: 0; text-align: center; opacity: .55; font: 13px system-ui, sans-serif; }
      #overlay {
        position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
        background: rgba(0,0,0,.72); font: 20px system-ui, sans-serif; text-align: center; z-index: 8;
      }
      #overlay h1 { font-size: 46px; margin: 0 0 12px; }
    </style>
  </head>
  <body>
    <a id="home" href="/">&#x2190; All games</a>
    <div id="mode-picker"></div>
    <canvas id="screen"></canvas>
    <div id="messages"></div>
    <div id="controls">A / D or arrows move &middot; W / S climb &amp; dive &middot; press Space per shot &middot; Shift boosts &middot; M missile &middot; H heals</div>
    <div id="overlay"></div>
    <script type="module" src="/src/spaceship-attack/main.ts"></script>
  </body>
</html>
